spring:
  application:
    name: PCPicker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/budget}
    username: ${DB_USER:budget}
    password: ${DB_PASSWORD:budget}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

nbu:
  api-url: https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json
  # оновлення курсів: щодня о 16:30 за київським часом (НБУ публікує курс на наступний день після ~15:00)
  refresh-cron: "0 30 16 * * *"
  zone: Europe/Kyiv
